<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="spec-writer">
  <title>spec-writer</title>

  <!-- earlier versions, kept alongside -->
  <g fill="none" stroke="#6366F1" stroke-width="7" stroke-linejoin="round" opacity="0.3">
    <rect x="72" y="18" width="148" height="184" rx="16"/>
    <rect x="61" y="26" width="148" height="184" rx="16"/>
  </g>

  <!-- the document being written -->
  <rect x="38" y="34" width="150" height="186" rx="16"
        fill="none" stroke="#6366F1" stroke-width="9" stroke-linejoin="round"/>

  <!-- traceability spine -->
  <path d="M72 70 V185" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

  <!-- six stages: a node and a requirement row each -->
  <g fill="#F59E0B">
    <circle cx="72" cy="70" r="7"/>
    <circle cx="72" cy="93" r="7"/>
    <circle cx="72" cy="116" r="7"/>
    <circle cx="72" cy="139" r="7"/>
    <circle cx="72" cy="162" r="7"/>
    <circle cx="72" cy="185" r="7"/>
  </g>
  <g stroke="#6366F1" stroke-width="9" stroke-linecap="round">
    <path d="M95 70 H160"/>
    <path d="M95 93 H148"/>
    <path d="M95 116 H162"/>
    <path d="M95 139 H141"/>
    <path d="M95 162 H155"/>
    <path d="M95 185 H133"/>
  </g>
</svg>
